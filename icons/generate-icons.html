<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikon-eksporter – Pro Kalkulator Ultra</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0a0c0b;color:#e9edeb;font-family:'Segoe UI',Roboto,sans-serif;padding:24px;box-sizing:border-box}
  h1{font-size:18px;margin:0}
  p{color:#9aa6a1;font-size:13px;max-width:420px;text-align:center;line-height:1.5;margin:0}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
  canvas{border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  button{background:#232826;color:#e9edeb;border:1px solid #2a302d;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}
  button:active{transform:scale(.96)}
  .primary{background:#ff9f0a;color:#1a1200;border:none}
</style>
</head>
<body>
<h1>Ikon-eksporter</h1>
<p>Trykk på «Last ned alle» og plasser de tre PNG-filene i <b>icons/</b>-mappen sammen med icon.svg. Deretter er appen fullt installerbar som PWA.</p>
<div class="row">
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>
  <canvas id="cm512" width="512" height="512"></canvas>
</div>
<div class="row">
  <button class="primary" id="dlAll">Last ned alle</button>
  <button id="dl192">icon-192.png</button>
  <button id="dl512">icon-512.png</button>
  <button id="dlm">icon-maskable-512.png</button>
</div>
<script>
function roundRect(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}
function draw(canvas,maskable){
  const size=canvas.width,x=canvas.getContext('2d');
  x.clearRect(0,0,size,size);
  x.fillStyle='#121514';
  if(maskable){x.fillRect(0,0,size,size);}else{roundRect(x,0,0,size,size,size*0.22);x.fill();}
  const g=maskable?0.55:1, o=maskable?(512*(1-g)/2):0, s=size/512;
  const P=v=>(o+v*g)*s;
  x.strokeStyle='#e9edeb';x.lineWidth=24*g*s;x.lineCap='round';
  roundRect(x,P(156),P(116),200*g*s,280*g*s,36*g*s);x.stroke();
  x.beginPath();x.moveTo(P(200),P(180));x.lineTo(P(312),P(180));x.stroke();
  x.beginPath();x.moveTo(P(200),P(236));x.lineTo(P(272),P(236));x.stroke();
  x.fillStyle='#ff9f0a';
  roundRect(x,P(272),P(292),64*g*s,64*g*s,16*g*s);x.fill();
}
function dl(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click();}
const c192=document.getElementById('c192'),c512=document.getElementById('c512'),cm=document.getElementById('cm512');
draw(c192,false);draw(c512,false);draw(cm,true);
document.getElementById('dl192').onclick=()=>dl(c192,'icon-192.png');
document.getElementById('dl512').onclick=()=>dl(c512,'icon-512.png');
document.getElementById('dlm').onclick=()=>dl(cm,'icon-maskable-512.png');
document.getElementById('dlAll').onclick=()=>{dl(c192,'icon-192.png');setTimeout(()=>dl(c512,'icon-512.png'),350);setTimeout(()=>dl(cm,'icon-maskable-512.png'),700);};
</script>
</body>
</html>
