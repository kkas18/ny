<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta id="metaTheme" name="theme-color" content="#0a0c0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kalkulator">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <title>Pro Kalkulator Ultra</title>
    <style>
        :root {
            --bg:#0a0c0b; --surface:#121514; --surface-light:#1a1e1c; --surface-lighter:#232826;
            --border:#2a302d; --text:#e9edeb; --text-secondary:#9aa6a1; --text-dim:#5f6b66;
            --danger:#e74c5e; --success:#2ecc71; --warning:#f39c12;
            --key-number-bg:#161a18; --key-number-text:#eef2f0;
            --key-func-bg:#1e2422;   --key-func-text:#9fb0aa;
            --key-op-bg:#242b28;     --key-op-text:#d6e0dc;
            --key-border:#2a302d;
            --key-clear-bg:rgba(231,76,94,0.16); --key-clear-text:#ef6b78; --key-clear-border:rgba(231,76,94,0.35);
            --key-equals-bg:#ff9f0a; --key-equals-text:#ffffff;
            --nav-active:#ff9f0a; --nav-active-soft:rgba(255,159,10,0.12);
            --radius-sm:10px; --radius-md:16px; --radius-lg:22px;
            --shadow:0 8px 32px rgba(0,0,0,0.4); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
            --transition:0.25s cubic-bezier(0.4,0,0.2,1); --transition-fast:0.15s cubic-bezier(0.4,0,0.2,1);
            --font-mono:'SF Mono','Cascadia Code','Roboto Mono','Courier New',monospace;
            --font-sans:'Segoe UI','Roboto',-apple-system,'Helvetica Neue',sans-serif;
            --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
            --safe-left: env(safe-area-inset-left,0px); --safe-right: env(safe-area-inset-right,0px);
            --header-height:52px; --nav-height:62px; --display-height:140px;
            --btn-min-height:48px; --btn-font-size:20px; --chip-font-size:13px; --result-font-size:44px;
        }
        [data-theme="light"] {
            --bg:#f4f5f4; --surface:#ffffff; --surface-light:#f2f4f3; --surface-lighter:#e8eae9;
            --border:#d9dddb; --text:#1c201e; --text-secondary:#5c6663; --text-dim:#9aa5a1;
            --danger:#d63040; --success:#00a865; --warning:#e8890c;
            --key-number-bg:#ffffff; --key-number-text:#202624;
            --key-func-bg:#eceeed;   --key-func-text:#5c6663;
            --key-op-bg:#e0e4e2;     --key-op-text:#333d39;
            --key-border:#d9dddb;
            --key-clear-bg:rgba(214,48,64,0.10); --key-clear-text:#d63040; --key-clear-border:rgba(214,48,64,0.30);
            --key-equals-bg:#ff9500; --key-equals-text:#ffffff;
            --nav-active:#d97706; --nav-active-soft:rgba(217,119,6,0.10);
            --shadow:0 8px 28px rgba(20,25,22,0.10); --shadow-sm:0 2px 10px rgba(20,25,22,0.08);
        }
        [data-theme="amoled"] {
            --bg:#000000; --surface:#0a0a0a; --surface-light:#101010; --surface-lighter:#181818;
            --border:#242424; --text:#ffffff; --text-secondary:#a8a8a8; --text-dim:#666666;
            --danger:#ff4444; --success:#00cc66; --warning:#ffaa00;
            --key-number-bg:#0d0d0d; --key-number-text:#ffffff;
            --key-func-bg:#151515;   --key-func-text:#999999;
            --key-op-bg:#1c1c1c;     --key-op-text:#dddddd;
            --key-border:#242424;
            --key-clear-bg:rgba(255,68,68,0.14); --key-clear-text:#ff6060; --key-clear-border:rgba(255,68,68,0.35);
            --key-equals-bg:#ff9f0a; --key-equals-text:#ffffff;
            --nav-active:#ff9f0a; --nav-active-soft:rgba(255,159,10,0.16);
            --shadow:0 8px 32px rgba(0,0,0,0.6); --shadow-sm:0 2px 12px rgba(0,0,0,0.5);
        }
        [data-theme="contrast"] {
            --bg:#000000; --surface:#000000; --surface-light:#111111; --surface-lighter:#222222;
            --border:#888888; --text:#ffffff; --text-secondary:#dddddd; --text-dim:#aaaaaa;
            --danger:#ff3333; --success:#33ff33; --warning:#ff9900;
            --key-number-bg:#000000; --key-number-text:#ffffff;
            --key-func-bg:#111111;   --key-func-text:#eeeeee;
            --key-op-bg:#222222;     --key-op-text:#ffffff;
            --key-border:#888888;
            --key-clear-bg:#2a0000; --key-clear-text:#ff8080; --key-clear-border:#ff4444;
            --key-equals-bg:#ffff00; --key-equals-text:#000000;
            --nav-active:#ffff00; --nav-active-soft:rgba(255,255,0,0.15);
            --shadow:0 8px 32px rgba(0,0,0,0.8); --shadow-sm:0 2px 12px rgba(0,0,0,0.8);
        }
        [data-theme="pastel"] {
            --bg:#f5f4f1; --surface:#fdfdfc; --surface-light:#f3f2ee; --surface-lighter:#eae8e3;
            --border:#dedbd4; --text:#2c2a26; --text-secondary:#6d6961; --text-dim:#a8a49b;
            --danger:#b55454; --success:#5da583; --warning:#c98f4a;
            --key-number-bg:#ffffff; --key-number-text:#2c2a26;
            --key-func-bg:#efede8;   --key-func-text:#6d6961;
            --key-op-bg:#e4e1da;     --key-op-text:#44403a;
            --key-border:#dedbd4;
            --key-clear-bg:rgba(191,84,84,0.12); --key-clear-text:#b55454; --key-clear-border:rgba(191,84,84,0.32);
            --key-equals-bg:#d9822b; --key-equals-text:#ffffff;
            --nav-active:#c06a15; --nav-active-soft:rgba(192,106,21,0.12);
            --shadow:0 8px 28px rgba(60,55,45,0.12); --shadow-sm:0 2px 10px rgba(60,55,45,0.10);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { width:100%; height:100%; overflow:hidden; font-family:var(--font-sans); background:var(--bg); color:var(--text); touch-action:manipulation; overscroll-behavior:none; }
        body { display:flex; flex-direction:column; padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); padding-left:var(--safe-left); padding-right:var(--safe-right); }
        .app-header { display:flex; align-items:center; justify-content:space-between; height:var(--header-height); padding:0 12px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); z-index:20; }
        .brand { display:flex; align-items:center; gap:8px; }
        .logo-icon { width:32px; height:32px; border-radius:9px; background:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .logo-icon svg { width:18px; height:18px; fill:none; stroke:var(--bg); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
        .app-name { font-size:16px; font-weight:700; letter-spacing:-0.3px; color:var(--text); }
        .app-version { font-size:9px; font-weight:500; color:var(--text-dim); letter-spacing:0.5px; }
        .header-actions { display:flex; align-items:center; gap:2px; }
        .header-btn { width:38px; height:38px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background var(--transition-fast),color var(--transition-fast); position:relative; flex-shrink:0; }
        .header-btn:hover { background:var(--surface-light); color:var(--text); }
        .header-btn:active { background:var(--surface-lighter); transform:scale(0.92); }
        .header-btn svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .header-btn .badge { position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; background:var(--text-secondary); color:var(--surface); font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); }
        .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; min-height:0; }
        .display-area { padding:12px 16px 8px; min-height:var(--display-height); max-height:var(--display-height); display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; position:relative; overflow:hidden; }
        .mode-indicator { position:absolute; top:8px; left:16px; font-size:9px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-dim); z-index:1; }
        .live-result { position:absolute; top:8px; right:16px; font-size:11px; color:var(--text-dim); font-family:var(--font-mono); z-index:1; }
        .expression { font-size:16px; font-weight:400; color:var(--text-secondary); font-family:var(--font-mono); white-space:nowrap; overflow-x:auto; overflow-y:hidden; max-width:100%; text-align:right; direction:rtl; scrollbar-width:none; line-height:1.3; position:relative; z-index:1; }
        .expression::-webkit-scrollbar { display:none; }
        .expression span { direction:ltr; display:inline-block; }
        .result { font-size:var(--result-font-size); font-weight:700; letter-spacing:-1.5px; color:var(--text); font-family:var(--font-mono); line-height:1.2; white-space:nowrap; overflow-x:auto; overflow-y:hidden; max-width:100%; text-align:right; scrollbar-width:none; position:relative; z-index:1; }
        .result::-webkit-scrollbar { display:none; }
        .result.shrink { font-size:calc(var(--result-font-size) * 0.75); }
        .result.error { color:var(--danger); font-size:calc(var(--result-font-size) * 0.65); }
        .buttons-container { flex:1; display:flex; flex-direction:column; background:var(--surface); overflow:hidden; padding:6px 10px 10px; min-height:0; }
        .calc-buttons { display:grid; gap:5px; flex:1; min-height:0; height:100%; grid-auto-rows:minmax(var(--btn-min-height),1fr); overflow-y:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
        .calc-buttons::-webkit-scrollbar { display:none; }
        .calc-buttons.standard-mode { grid-template-columns: repeat(4, 1fr); }
        .calc-buttons.professional-mode { grid-template-columns: repeat(4, 1fr); --btn-min-height:38px; gap:4px; }
        .calc-buttons.rpn-mode { grid-template-columns: repeat(4, 1fr); --btn-min-height:44px; }
        .calc-btn { border:none; border-radius:var(--radius-sm); font-size:var(--btn-font-size); font-weight:500; cursor:pointer; transition:all var(--transition-fast); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:var(--font-sans); letter-spacing:0.2px; color:var(--text); background:var(--surface-light); border:1px solid var(--key-border); min-height:0; height:100%; width:100%; outline:none; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
        .calc-btn:active { transform:scale(0.94); filter:brightness(1.15); }
        .calc-btn:focus-visible { outline:2px solid var(--text-dim); outline-offset:2px; }
        .calc-btn .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.22); transform:scale(0); animation:ripple-anim 0.5s ease-out; pointer-events:none; }
        [data-theme="light"] .calc-btn .ripple,[data-theme="pastel"] .calc-btn .ripple { background:rgba(0,0,0,0.12); }
        [data-theme="contrast"] .calc-btn .ripple { background:rgba(255,255,255,0.35); }
        @keyframes ripple-anim { to { transform:scale(4); opacity:0; } }
        .calc-btn.number-btn { background:var(--key-number-bg); color:var(--key-number-text); border-color:var(--key-border); font-weight:600; font-size:calc(var(--btn-font-size) * 1.1); }
        .calc-btn.operator-btn { background:var(--key-op-bg); color:var(--key-op-text); border-color:var(--key-border); font-weight:600; font-size:calc(var(--btn-font-size) * 1.05); }
        .calc-btn.function-btn { background:var(--key-func-bg); color:var(--key-func-text); border-color:var(--key-border); font-size:calc(var(--btn-font-size) * 0.8); font-weight:500; }
        .calc-btn.memory-btn { background:var(--key-func-bg); color:var(--key-func-text); border-color:var(--key-border); font-weight:600; font-size:calc(var(--btn-font-size) * 0.75); letter-spacing:0.4px; }
        .calc-btn.constant-btn { background:var(--key-func-bg); color:var(--key-op-text); border-color:var(--key-border); font-weight:600; font-size:calc(var(--btn-font-size) * 0.9); }
        .calc-btn.backspace-btn { background:var(--key-func-bg); color:var(--key-func-text); border-color:var(--key-border); }
        .calc-btn.clear-btn { background:var(--key-clear-bg); color:var(--key-clear-text); border-color:var(--key-clear-border); font-weight:700; }
        .calc-btn.equals-btn { background:var(--key-equals-bg); color:var(--key-equals-text); font-weight:700; font-size:calc(var(--btn-font-size) * 1.2); border:none; }
        .calc-btn .btn-label { font-size:inherit; line-height:1; }
        .converter-container { flex:1; display:flex; flex-direction:column; padding:14px 16px 16px; gap:12px; overflow-y:auto; background:var(--surface); position:relative; scrollbar-width:none; }
        .converter-container::-webkit-scrollbar { display:none; }
        .category-chips { display:flex; gap:6px; overflow-x:auto; padding:4px 2px 6px; scrollbar-width:none; flex-shrink:0; position:relative; z-index:1; }
        .category-chips::-webkit-scrollbar { display:none; }
        .chip { padding:9px 16px; border-radius:999px; border:1px solid var(--border); background:var(--surface-light); color:var(--text-secondary); font-size:var(--chip-font-size); font-weight:600; cursor:pointer; white-space:nowrap; transition:all var(--transition-fast); flex-shrink:0; letter-spacing:0.3px; }
        .chip:active { transform:scale(0.95); }
        .chip.active { background:var(--text); color:var(--bg); border-color:var(--text); }
        .chip-ico { margin-right:6px; }
        .rate-status { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--text-dim); padding:0 2px; flex-shrink:0; position:relative; z-index:1; font-family:var(--font-mono); }
        .rate-dot { width:6px; height:6px; border-radius:50%; background:var(--warning); flex-shrink:0; }
        .rate-dot.live { background:var(--success); }
        .rate-refresh { margin-left:auto; background:none; border:none; color:var(--text-dim); cursor:pointer; padding:4px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:color var(--transition-fast); }
        .rate-refresh:active { color:var(--text); transform:scale(0.9); }
        .rate-refresh svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .converter-card { position:relative; z-index:1; border-radius:var(--radius-lg); padding:16px; border:1px solid var(--border); background:var(--surface-light); overflow:hidden; flex-shrink:0; }
        .converter-card .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; position:relative; z-index:1; gap:8px; }
        .converter-card .card-label { font-size:10px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-dim); }
        .unit-picker { display:flex; align-items:center; gap:8px; max-width:68%; padding:7px 10px 7px 7px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; transition:all var(--transition-fast); font-family:var(--font-sans); }
        .unit-picker:active { transform:scale(0.96); }
        .unit-picker .u-symbol { min-width:30px; height:30px; padding:0 8px; border-radius:9px; background:var(--surface-lighter); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700; flex-shrink:0; }
        .unit-picker .u-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .unit-picker .chev { width:14px; height:14px; fill:none; stroke:var(--text-dim); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
        .u-flag { width:24px; height:18px; border-radius:4px; object-fit:cover; box-shadow:0 0 0 1px rgba(128,128,128,0.25); display:block; }
        .u-symbol.flag { padding:0; background:transparent; }
        .converter-card .value-input { width:100%; background:transparent; border:none; color:var(--text); font-size:30px; font-weight:700; font-family:var(--font-mono); padding:6px 0 2px; outline:none; letter-spacing:-0.5px; caret-color:var(--text); user-select:text; -webkit-user-select:text; position:relative; z-index:1; }
        .converter-card .value-input.readonly { color:var(--text-secondary); caret-color:transparent; }
        .converter-card .conversion-hint { font-size:11px; color:var(--text-dim); margin-top:4px; min-height:14px; position:relative; z-index:1; font-family:var(--font-mono); }
        .swap-btn-wrapper { display:flex; justify-content:center; margin:-24px 0; position:relative; z-index:5; flex-shrink:0; pointer-events:none; }
        .swap-btn { pointer-events:auto; width:52px; height:52px; border-radius:50%; border:1px solid var(--border); background:var(--surface-lighter); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 6px var(--surface), 0 2px 8px rgba(0,0,0,0.25); transition:transform .2s var(--transition-fast); }
        .swap-btn:active { transform:scale(0.9); }
        .swap-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
        .pct-result { font-size:34px; font-weight:700; font-family:var(--font-mono); color:var(--text); padding:6px 0 2px; letter-spacing:-0.5px; position:relative; z-index:1; white-space:nowrap; overflow-x:auto; scrollbar-width:none; }
        .pct-result::-webkit-scrollbar { display:none; }
        .use-in-calc-btn { margin-top:12px; width:100%; padding:11px; border-radius:14px; border:1px solid var(--border); background:var(--surface-lighter); color:var(--text); font-weight:700; font-size:13px; cursor:pointer; transition:all var(--transition-fast); font-family:var(--font-sans); position:relative; z-index:1; }
        .use-in-calc-btn:active { transform:scale(0.97); filter:brightness(1.1); }
        .sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:80; opacity:0; pointer-events:none; transition:opacity var(--transition); }
        .sheet-overlay.open { opacity:1; pointer-events:auto; }
        .unit-sheet { position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--surface); border-radius:26px 26px 0 0; border-top:1px solid var(--border); transform:translateY(105%); transition:transform .32s cubic-bezier(.32,.72,.24,1); max-height:72vh; display:flex; flex-direction:column; padding-bottom:calc(10px + var(--safe-bottom)); box-shadow:0 -14px 44px rgba(0,0,0,0.45); }
        .unit-sheet.open { transform:translateY(0); }
        .sheet-handle { width:44px; height:4px; border-radius:2px; background:var(--border); margin:10px auto 4px; flex-shrink:0; }
        .sheet-title { padding:6px 20px 10px; font-size:14px; font-weight:700; color:var(--text-secondary); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .sheet-close { background:none; border:none; color:var(--text-secondary); font-size:13px; font-weight:700; cursor:pointer; padding:6px 10px; border-radius:10px; transition:background var(--transition-fast); }
        .sheet-close:active { background:var(--surface-light); }
        .sheet-search { padding:0 16px 8px; flex-shrink:0; }
        .sheet-search input { width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:12px; padding:9px 12px; color:var(--text); font-size:13px; outline:none; font-family:var(--font-sans); }
        .sheet-search input:focus { border-color:var(--text-dim); }
        .sheet-grid { overflow-y:auto; padding:4px 14px 12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .sheet-empty { grid-column:1/-1; text-align:center; color:var(--text-dim); font-size:12px; padding:18px 0; }
        .unit-option { display:flex; align-items:center; gap:10px; padding:10px; border-radius:16px; border:1px solid var(--border); background:var(--surface-light); cursor:pointer; transition:all var(--transition-fast); color:var(--text); font-family:var(--font-sans); text-align:left; }
        .unit-option:active { transform:scale(0.97); }
        .unit-option .u-symbol { min-width:38px; height:38px; padding:0 8px; border-radius:11px; background:var(--surface-lighter); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; color:var(--text-secondary); font-size:12px; flex-shrink:0; }
        .unit-option .u-symbol.flag { background:transparent; }
        .unit-option .u-label { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .unit-option .check { width:16px; height:16px; margin-left:auto; fill:none; stroke:var(--text); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
        .unit-option.selected { border-color:var(--text-dim); background:var(--surface-lighter); }
        .unit-option.selected .u-symbol:not(.flag) { background:var(--text); color:var(--bg); }
        @media (max-width:340px) { .sheet-grid { grid-template-columns:1fr; } }
        #settingsModal { display:block; }
        .settings-sheet { position:fixed; left:0; right:0; bottom:0; margin:0 auto; width:min(520px,100vw); background:var(--surface); border-radius:26px 26px 0 0; border-top:1px solid var(--border); transform:translateY(105%); transition:transform .32s cubic-bezier(.32,.72,.24,1); max-height:82vh; overflow-y:auto; padding-bottom:calc(14px + var(--safe-bottom)); box-shadow:0 -14px 44px rgba(0,0,0,0.45); scrollbar-width:none; z-index:90; }
        .settings-sheet::-webkit-scrollbar { display:none; }
        #settingsModal.open .settings-sheet { transform:translateY(0); }

            function parseNum(v){ if(typeof v!=='string')v=String(v); return parseFloat(v.replace(',','.')); }
            function formatNumber(num, dec) {
                if (typeof num !== 'number' || !Number.isFinite(num)) return 'Error';
                const d = dec || state.decimals;
                if (Number.isInteger(num) && Math.abs(num) < 1e15) return num.toString();
                const abs = Math.abs(num);
                if (abs !== 0 && (abs < 1e-6 || abs > 1e12)) return num.toExponential(6);
                let s = num.toPrecision(d);
                if (s.includes('.')) s = s.replace(/\.?0+$/,'');
                if (s === '-0') s = '0';
                return s;
            }
            function evaluateExpression(expr) { return evaluateRPN(toRPN(tokenize(expr))); }
            function tokenize(expr) {
                const tokens=[]; let i=0; const s=expr;
                while(i<s.length){
                    const c=s[i];
                    if(c===' '){i++;continue;}
                    if(c==='π'){tokens.push({t:'num',v:Math.PI});i++;continue;}
                    if(c==='e'&&!/[a-zA-Z]/.test(s[i+1]||'')&&!/[a-zA-Z0-9]/.test(s[i-1]||'')){tokens.push({t:'num',v:Math.E});i++;continue;}
                    if(/[0-9.]/.test(c)){
                        let n='';
                        while(i<s.length&&/[0-9.]/.test(s[i])){n+=s[i];i++;}
                        if((s[i]==='e'||s[i]==='E')&&/[0-9+-]/.test(s[i+1]||'')){
                            n+=s[i++];
                            if(s[i]==='+'||s[i]==='-')n+=s[i++];
                            while(i<s.length&&/[0-9]/.test(s[i])){n+=s[i];i++;}
                        }
                        tokens.push({t:'num',v:parseFloat(n)});
                        continue;
                    }
                    if(/[+\-−×÷^%]/.test(c)){
                        if((c==='-'||c==='−')&&(tokens.length===0||tokens[tokens.length-1].t==='op'||tokens[tokens.length-1].t==='lp'||tokens[tokens.length-1].t==='func')){tokens.push({t:'unary'});}
                        else { tokens.push({t:'op',v:c==='−'?'-':c});}
                        i++;continue;
                    }
                    if(c==='('){tokens.push({t:'lp',v:'('});i++;continue;}
                    if(c===')'){tokens.push({t:'rp',v:')'});i++;continue;}
                    if(c==='√'){tokens.push({t:'func',v:'sqrt'});i++;continue;}
                    if(c==='∛'){tokens.push({t:'func',v:'cbrt'});i++;continue;}
                    if(c==='²'){tokens.push({t:'sq'});i++;continue;}
                    if(c==='!'){tokens.push({t:'fact'});i++;continue;}
                    if(/[a-zA-Z]/.test(c)){let w='';while(i<s.length&&/[a-zA-Z]/.test(s[i])){w+=s[i];i++;}const lw=w.toLowerCase();
                        if(['sin','cos','tan','asin','acos','atan','log','ln','sqrt','cbrt'].includes(lw)){tokens.push({t:'func',v:lw});}
                        else if(lw==='ans'){tokens.push({t:'num',v:state.lastAnswer});}
                        else{tokens.push({t:'err',v:w});}
                        continue;
                    }
                    i++;
                }
                return tokens;
            }
            function toRPN(tokens){
                const out=[],ops=[];const prec={'+':1,'-':1,'×':2,'÷':2,'%':3,'^':4};const rightAssoc={'^':true};
                for(const t of tokens){
                    if(t.t==='err')throw new Error('Ugyldig token: '+t.v);
                    if(t.t==='num'){out.push(t);continue;}
                    if(t.t==='func'){ops.push(t);continue;}
                    if(t.t==='unary'){ops.push({t:'op',v:'unary',p:3.5});continue;}
                    if(t.t==='lp'){ops.push(t);continue;}
                    if(t.t==='rp'){while(ops.length&&ops[ops.length-1].t!=='lp'){out.push(ops.pop());}if(ops.length)ops.pop();else throw new Error('Ubalanserte parenteser');if(ops.length&&ops[ops.length-1].t==='func')out.push(ops.pop());continue;}
                    if(t.t==='sq'||t.t==='fact'){out.push(t);continue;}
                    if(t.t==='op'){const p=prec[t.v]||1;while(ops.length&&ops[ops.length-1].t!=='lp'){const top=ops[ops.length-1];const tp=top.p||(prec[top.v]||0);if(tp>p||(tp===p&&!rightAssoc[t.v]))out.push(ops.pop());else break;}ops.push({t:'op',v:t.v,p});continue;}
                }
                while(ops.length){const op=ops.pop();if(op.t==='lp')throw new Error('Ubalanserte parenteser');out.push(op);}
                return out;
            }
            function evaluateRPN(rpn){
                const st=[];
                for(const t of rpn){
                    if(t.t==='num'){st.push(t.v);}
                    else if(t.t==='op'){
                        if(t.v==='unary'){const a=st.pop();if(a===undefined)throw new Error('Ugyldig uttrykk');st.push(-a);}
                        else{const b=st.pop(),a=st.pop();if(a===undefined||b===undefined)throw new Error('Ugyldig uttrykk');switch(t.v){
                            case '+':st.push(a+b);break; case '-':st.push(a-b);break; case '×':st.push(a*b);break;
                            case '÷':if(b===0)throw new Error('Divisjon med null');st.push(a/b);break;
                            case '%':st.push(a%b);break; case '^':st.push(Math.pow(a,b));break; }}
                    }
                    else if(t.t==='func'){const a=st.pop();if(a===undefined)throw new Error('Ugyldig funksjonsargument');const rad=state.trigMode==='rad';const toRad=v=>rad?v:v*Math.PI/180;switch(t.v){
                        case 'sin':st.push(Math.sin(toRad(a)));break; case 'cos':st.push(Math.cos(toRad(a)));break; case 'tan':st.push(Math.tan(toRad(a)));break;
                        case 'asin':st.push(rad?Math.asin(a):Math.asin(a)*180/Math.PI);break;
                        case 'acos':st.push(rad?Math.acos(a):Math.acos(a)*180/Math.PI);break;
                        case 'atan':st.push(rad?Math.atan(a):Math.atan(a)*180/Math.PI);break;
                        case 'log':if(a<=0)throw new Error('Logaritme krever positivt tall');st.push(Math.log10(a));break;
                        case 'ln':if(a<=0)throw new Error('Logaritme krever positivt tall');st.push(Math.log(a));break;
                        case 'sqrt':if(a<0)throw new Error('Kan ikke ta rot av negativt tall');st.push(Math.sqrt(a));break;
                        case 'cbrt':st.push(Math.cbrt(a));break; }}
                    else if(t.t==='sq'){const a=st.pop();if(a===undefined)throw new Error('Ugyldig uttrykk');st.push(a*a);}
                    else if(t.t==='fact'){const a=st.pop();if(a===undefined||a<0||!Number.isInteger(a)||a>170)throw new Error('Fakultet krever positivt heltall');let r=1;for(let i=2;i<=a;i++)r*=i;st.push(r);}
                }
                if(st.length!==1)throw new Error('Ugyldig uttrykk');
                return st[0];
            }

                if(state.expression.trim()===''){liveResultEl.textContent='';return;}
                try{const r=evaluateExpression(state.expression);if(typeof r==='number'&&Number.isFinite(r))liveResultEl.textContent='= '+formatNumber(r);else liveResultEl.textContent='';}catch(e){liveResultEl.textContent='';}
            }
            function appendToExpression(str){
                if(state.justEvaluated&&state.result!=='Error'&&state.result!=='Ugyldig uttrykk'){if(/[0-9(πe√∛]/.test(str))state.expression=str;else state.expression=state.lastAnswer.toString()+str;state.justEvaluated=false;}
                else if(state.justEvaluated){state.expression=str;state.justEvaluated=false;}
                else {if(state.expression.length>=CONFIG.maxExpressionLength){showToast('Maksimal lengde');return false;}state.expression+=str;}
                updateDisplay();return true;
            }
            function insertValue(str){
                if(state.justEvaluated){state.expression=str;state.justEvaluated=false;updateDisplay();return;}
                const e=state.expression;
                if(e!==''&&/[0-9)πe]/.test(e[e.length-1]))state.expression+='×'+str;else state.expression+=str;
                updateDisplay();
            }
            function handleNumber(num){appendToExpression(num);}
            function handleOperator(op){
                if(state.justEvaluated){if(state.result!=='Error'&&state.result!=='Ugyldig uttrykk'){state.expression=state.lastAnswer.toString()+op;state.justEvaluated=false;updateDisplay();return;}else{state.expression='';state.justEvaluated=false;}}
                const expr=state.expression;
                if(expr===''){if(op==='−'){state.expression='−';updateDisplay();}return;}
                const last=expr[expr.length-1];
                if(last==='('){if(op==='−')state.expression+='−';updateDisplay();return;}
                if(['+','−','×','÷','^'].includes(last)){state.expression=expr.slice(0,-1)+op;}
                else state.expression+=op;
                updateDisplay();
            }
            function handleDecimal(){const expr=state.expression;if(state.justEvaluated){state.expression='0.';state.justEvaluated=false;updateDisplay();return;}if(expr===''){state.expression='0.';updateDisplay();return;}let i=expr.length-1,has=false;while(i>=0&&/[0-9.]/.test(expr[i])){if(expr[i]==='.'){has=true;break;}i--;}if(!has)state.expression+='.';updateDisplay();}
            function handleParen(p){if(state.justEvaluated&&state.result!=='Error'){state.expression=p;state.justEvaluated=false;updateDisplay();return;}if(p==='('){const e=state.expression;if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression+='×(';else state.expression+='(';}else{const oc=(state.expression.match(/\(/g)||[]).length,cc=(state.expression.match(/\)/g)||[]).length;if(cc<oc&&state.expression!==''&&!/[(\+−×÷\^]/.test(state.expression[state.expression.length-1]))state.expression+=')';}updateDisplay();}
            function handleFunc(f){if(state.justEvaluated&&state.result!=='Error'){state.expression=f;state.justEvaluated=false;updateDisplay();return;}const e=state.expression;if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression+='×'+f;else state.expression+=f;updateDisplay();}
            function handleConstant(v){insertValue(v);}
            function handlePower(p){if(p==='²'){const e=state.expression;if(state.justEvaluated&&state.result!=='Error'){state.expression=state.lastAnswer.toString()+'²';state.justEvaluated=false;updateDisplay();return;}if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression+='²';updateDisplay();}else handleOperator('^');}
            function handleFactorial(){const e=state.expression;if(state.justEvaluated&&state.result!=='Error'){state.expression=state.lastAnswer.toString()+'!';state.justEvaluated=false;updateDisplay();return;}if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression+='!';updateDisplay();}
            function handleReciprocal(){const e=state.expression;if(state.justEvaluated&&state.result!=='Error'){state.expression='('+state.lastAnswer.toString()+')^(-1)';state.justEvaluated=false;updateDisplay();return;}if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression='('+e+')^(-1)';updateDisplay();}
            function handleSign(){
                const e=state.expression;
                if(state.justEvaluated&&state.result!=='Error'){state.expression='−('+state.lastAnswer.toString()+')';state.justEvaluated=false;updateDisplay();return;}
                if(e===''){state.expression='−';updateDisplay();return;}
                let i=e.length-1,start=-1;
                while(i>=0){const c=e[i];if(/[0-9.)]/.test(c)){i--;continue;}else if(c==='('&&i>0&&e[i-1]==='−'){start=i-1;break;}else if(c==='−'&&i===0){start=0;break;}else if('+-×÷^'.includes(c)){start=i+1;break;}i--;}
                if(start===-1)start=0;
                const before=e.slice(0,start),rest=e.slice(start);
                if(rest===''){state.expression=before+'−';updateDisplay();return;}
                if(rest.startsWith('−(')&&rest.endsWith(')'))state.expression=before+rest.slice(2,-1);
                else if(rest.startsWith('-'))state.expression=before+rest.slice(1);
                else state.expression=before+'−('+rest+')';
                updateDisplay();
            }
            function handlePercent(){const e=state.expression;if(state.justEvaluated&&state.result!=='Error'){state.expression='('+state.lastAnswer.toString()+')÷100';state.justEvaluated=false;updateDisplay();return;}if(e!==''&&/[0-9)]/.test(e[e.length-1]))state.expression='('+e+')÷100';updateDisplay();}
            function handleAns(){insertValue(state.lastAnswer.toString());}
            function handleTrigMode(){state.trigMode=state.trigMode==='deg'?'rad':'deg';updateTrigLabel();showToast('Vinkelmåte: '+(state.trigMode==='deg'?'DEG':'RAD'));}
            function updateTrigLabel(){const btn=document.querySelector('.calc-btn[data-action="trigMode"] .btn-label');if(btn)btn.textContent=state.trigMode==='deg'?'DEG':'RAD';}
            function handleEquals(){
                const expr=state.expression.trim();if(expr==='')return;
                try{
                    const result=evaluateExpression(expr);
                    const formatted=formatNumber(result);
                    addHistoryEntry(expr,formatted);
                    state.result=formatted;state.lastAnswer=result;state.justEvaluated=true;state.expression=expr;
                    updateDisplay();
                }catch(e){state.result='Error';state.justEvaluated=true;updateDisplay();showToast(e.message||'Beregningsfeil');}
            }
            function handleClear(){state.expression='';state.result='0';state.justEvaluated=false;liveResultEl.textContent='';updateDisplay();}
            function handleBackspace(){
                if(state.justEvaluated)state.justEvaluated=false;
                const e=state.expression;if(e==='')return;
                const funcs=['sin(','cos(','tan(','asin(','acos(','atan(','log(','ln(','√(','∛('];
                let removed=false;
                for(const f of funcs){if(e.endsWith(f)){state.expression=e.slice(0,-f.length);removed=true;break;}}
                if(!removed)state.expression=e.slice(0,-1);
                if(state.expression==='')state.result='0';
                updateDisplay();
            }

            function memoryClear(){state.memory=0;showToast('Minne tømt');}
            function memoryRecall(){insertValue(state.memory.toString());showToast('Minne hentet');}
            function memoryAdd(){const r=parseFloat(state.result);if(!isNaN(r)&&Number.isFinite(r)){state.memory+=r;showToast('Lagt til minne');}else showToast('Ugyldig verdi for M+');}
            function memorySubtract(){const r=parseFloat(state.result);if(!isNaN(r)&&Number.isFinite(r)){state.memory-=r;showToast('Trukket fra minne');}else showToast('Ugyldig verdi for M-');}

            function rpnClear(){state.stack=[];state.expression='';state.result='0';updateDisplay();}
            function rpnBackspace(){if(state.expression!==''){state.expression=state.expression.slice(0,-1);updateDisplay();}else if(state.stack.length){state.stack.pop();updateRpnDisplay();}}
            function rpnSwap(){if(state.stack.length>=2){const a=state.stack.pop(),b=state.stack.pop();state.stack.push(a,b);updateRpnDisplay();}else showToast('Trenger to tall');}
            function rpnDrop(){if(state.stack.length)state.stack.pop();updateRpnDisplay();}
            function rpnEnter(){if(state.expression!==''){const v=parseFloat(state.expression);if(!isNaN(v)){state.stack.push(v);state.expression='';}else showToast('Ugyldig tall');}else if(state.result!=='0'&&state.result!=='Error'){const v=parseFloat(state.result);if(!isNaN(v))state.stack.push(v);}updateRpnDisplay();}
            function rpnNumber(n){state.expression+=n;updateDisplay();}
            function rpnDecimal(){if(!state.expression.includes('.'))state.expression+=state.expression===''?'0.':'.';updateDisplay();}
            function rpnOp(op){if(state.stack.length<2){showToast('Trenger to tall');return;}const b=state.stack.pop(),a=state.stack.pop();let res;switch(op){case '+':res=a+b;break;case '-':res=a-b;break;case '*':res=a*b;break;case '/':if(b===0){state.stack.push(a,b);showToast('Divisjon med null');return;}res=a/b;break;}state.stack.push(res);state.result=formatNumber(res);state.expression='';updateRpnDisplay();}
            function updateRpnDisplay(){if(state.stack.length){state.result=formatNumber(state.stack[state.stack.length-1]);}else if(state.expression==='')state.result='0';updateDisplay();}

            function fetchJSON(url,ms){
                return new Promise((resolve,reject)=>{
                    const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
                    const timer=setTimeout(()=>{ if(ctrl)ctrl.abort(); reject(new Error('Tidsavbrudd')); },ms||8000);
                    fetch(url, ctrl?{signal:ctrl.signal}:{})
                        .then(r=>{ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
                        .then(j=>{ clearTimeout(timer); resolve(j); })
                        .catch(e=>{ clearTimeout(timer); reject(e); });
                });
            }
            function loadCachedMeta(){ try{ const c=JSON.parse(localStorage.getItem('procalc_curmeta')||'null'); if(c&&c.meta&&Object.keys(c.meta).length)return c.meta; }catch(e){} return null; }
            function cacheMeta(m){ try{ localStorage.setItem('procalc_curmeta',JSON.stringify({t:Date.now(),meta:m})); }catch(e){} }
            function buildMeta(arr){
                if(!Array.isArray(arr))return null;
                const meta={};
                arr.forEach(co=>{
                    const cc=(co.cca2||'').toLowerCase();
                    const flag=co.flags&&co.flags.png;
                    const curs=co.currencies||{};
                    Object.keys(curs).forEach(code=>{
                        if(!/^[A-Z]{3}$/.test(code))return;
                        if(code==='EUR'){ if(!meta.EUR)meta.EUR={name:'Euro',sym:'€',flag:'https://flagcdn.com/w40/eu.png'}; return; }
                        if(!meta[code])meta[code]={name:(curs[code]&&curs[code].name)||code,sym:(curs[code]&&curs[code].symbol)||'',flag:flag||('https://flagcdn.com/w40/'+cc+'.png')};
                    });
                });
                return Object.keys(meta).length?meta:null;
            }
            function applyCurrencyData(rates,meta){
                meta=meta||{};
                const prev=conversionData.currency.units;
                const units={};
                function add(c){
                    const m=meta[c]; const key=c.toLowerCase();
                    const f=(rates&&typeof rates[c]==='number'&&rates[c]>0)?1/rates[c]:(prev[key]?prev[key].f:1);
                    units[key]={ l:CUR_NO[c]||(m?m.name:(prev[key]?prev[key].l:c)), s:c, f:f,
                        sym:(m&&m.sym)||(prev[key]?prev[key].sym:''),
                        flag:((m&&m.flag)||(prev[key]?prev[key].flag:null))||('https://flagcdn.com/w40/'+c.slice(0,2).toLowerCase()+'.png') };
                }
                add('NOK');
                if(rates){
                    const pref=['USD','EUR','GBP','SEK','DKK','JPY','CHF','CAD','AUD','CNY','INR','PLN','ISK','KRW','MXN','BRL','TRY','THB','RUB','CZK','HUF','ZAR','HKD','SGD','NZD','AED','SAR'];
                    pref.forEach(c=>{ if(typeof rates[c]==='number'&&rates[c]>0)add(c); });
                    Object.keys(rates).sort().forEach(c=>{ if(c!=='NOK'&&typeof rates[c]==='number'&&rates[c]>0&&!units[c.toLowerCase()])add(c); });
                } else {
                    Object.keys(prev).forEach(k=>{
                        const c=k.toUpperCase(); const m=meta[c];
                        units[k]={ l:CUR_NO[c]||(m?m.name:prev[k].l), s:c, f:prev[k].f,
                            sym:(m&&m.sym)||prev[k].sym||'',
                            flag:(m&&m.flag)||prev[k].flag||('https://flagcdn.com/w40/'+c.slice(0,2).toLowerCase()+'.png') };
                    });
                }
                conversionData.currency.units=units;
                if(!units[state.converter.fromUnit])state.converter.fromUnit='nok';
                if(!units[state.converter.toUnit])state.converter.toUnit='usd';
            }
            let liveFetching=false, liveOk=false;
            function refreshRateStatus(){

            }
            function ensureCurrencyLive(force){
                if(liveFetching)return;
                if(liveOk&&!force)return;
                if(force)liveOk=false;
                liveFetching=true;
                rateDot.classList.remove('live');
                rateText.textContent='Henter live valuta-data…';
                const cached=loadCachedMeta();
                const metaPromise=cached?Promise.resolve(null):fetchJSON(CONFIG.metaUrl,12000).catch(()=>null);
                Promise.allSettled([fetchJSON(CONFIG.ratesUrl,8000),metaPromise]).then(rs=>{
                    const ratesJ=rs[0].status==='fulfilled'?rs[0].value:null;
                    const metaJ=rs[1].status==='fulfilled'?rs[1].value:null;
                    const rates=(ratesJ&&ratesJ.result==='success'&&ratesJ.rates)?ratesJ.rates:null;
                    let meta=buildMeta(metaJ);
                    if(meta)cacheMeta(meta);
                    meta=meta||cached;
                    if(rates||meta){
                        applyCurrencyData(rates,meta);
                        const count=Object.keys(conversionData.currency.units).length;
                        if(rates){
                            liveOk=true;rateDot.classList.add('live');

                        } else { rateText.textContent=meta?'Standardkurser • ikoner hentet':'Offline: standardkurser'; }
                        if(state.converter.category==='currency'){

                            if(unitSheet.classList.contains('open'))openUnitSheet(sheetTarget);

                        if(force)showToast(rates?'Valutakurser oppdatert':'Ikoner oppdatert');
                    } else {
                        rateText.textContent='Offline: standardkurser';
                        if(force)showToast('Live-data utilgjengelig – bruker standardverdier');
                    }
                }).finally(()=>{ liveFetching=false; });
            }

            function performConversion(){

                else if(cat==='fuel'){result=convertFuel(iv,fk,tk);}
                else{const ff=data.units[fk].f,tf=data.units[tk].f;result=iv*ff/tf;}
                toValueInput.value=formatNumber(result);
                updateHints();
            }
            function convertTemperature(v,f,t){let c;switch(f){case'celsius':c=v;break;case'fahrenheit':c=(v-32)*5/9;break;case'kelvin':c=v-273.15;break;}switch(t){case'celsius':return c;case'fahrenheit':return c*9/5+32;case'kelvin':return c+273.15;}}

            function addHistoryEntry(e,r){state.history.unshift({expr:e,result:r,timestamp:new Date().toISOString()});if(state.history.length>CONFIG.maxHistoryEntries)state.history.pop();saveHistory();updateHistoryBadge();renderHistory(historySearchInput.value);}
            function updateHistoryBadge(){const c=state.history.length;if(c>0){historyBadge.style.display='flex';historyBadge.textContent=c>99?'99+':c.toString();}else historyBadge.style.display='none';}
            function renderHistory(filter){
                filter=filter||'';
                if(state.history.length===0){historyList.innerHTML='<div class="history-empty">Ingen beregninger enda.</div>';return;}
                historyList.innerHTML='';
                const filtered=state.history.filter(e=>!filter||e.expr.includes(filter)||e.result.includes(filter));
                if(filtered.length===0){historyList.innerHTML='<div class="history-empty">Ingen treff.</div>';return;}
                filtered.forEach((entry)=>{
                    const realIdx=state.history.indexOf(entry);
                    const div=document.createElement('div');div.className='history-entry';
                    const time=new Date(entry.timestamp);
                    const ts=time.toLocaleDateString('no-NO',{day:'2-digit',month:'short'})+' '+time.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
                    div.innerHTML='<div class="hist-expr">'+escapeHtml(entry.expr)+'</div><div class="hist-result">'+escapeHtml(entry.result)+'</div><div class="hist-time">'+ts+'</div><button class="hist-copy" aria-label="Kopier"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="hist-delete" aria-label="Slett"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>';
                    div.addEventListener('click',e=>{
                        if(e.target.closest('.hist-delete')||e.target.closest('.hist-copy'))return;
                        state.expression=entry.expr;state.result=entry.result;state.justEvaluated=true;state.lastAnswer=parseFloat(entry.result)||0;
                        closeHistory();updateDisplay();showToast('Uttrykk hentet');
                    });
                    div.querySelector('.hist-copy').addEventListener('click',e=>{e.stopPropagation();copyText(entry.result,'Kopiert: '+entry.result);});
                    div.querySelector('.hist-delete').addEventListener('click',e=>{e.stopPropagation();state.history.splice(realIdx,1);saveHistory();updateHistoryBadge();renderHistory(historySearchInput.value);showToast('Slettet');});
                    historyList.appendChild(div);
                });
            }
            function saveHistory(){try{localStorage.setItem('procalc_history',JSON.stringify(state.history));}catch(e){}}
            function loadHistory(){try{const s=localStorage.getItem('procalc_history');if(s)state.history=JSON.parse(s);if(!Array.isArray(state.history))state.history=[];}catch(e){state.history=[];}}
            function clearHistory(){state.history=[];saveHistory();updateHistoryBadge();renderHistory();showToast('Historikk tømt');}
            function exportHistory(){if(state.history.length===0){showToast('Ingen historikk å eksportere');return;}const csv=['Uttrykk,Resultat,Tidspunkt'];state.history.forEach(e=>{csv.push('"'+e.expr.replace(/"/g,'""')+'","'+e.result.replace(/"/g,'""')+'","'+e.timestamp+'"');});const blob=new Blob([csv.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kalkulator_historikk.csv';a.click();URL.revokeObjectURL(a.href);showToast('Historikk eksportert');}

            function copyText(txt,msg){
                if(navigator.clipboard&&navigator.clipboard.writeText){
                    navigator.clipboard.writeText(txt).then(()=>showToast(msg)).catch(()=>fallbackCopy(txt,msg));
                } else fallbackCopy(txt,msg);
            }
            function fallbackCopy(txt,msg){
                const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
                document.body.appendChild(ta);ta.focus();ta.select();
                try{document.execCommand('copy');showToast(msg);}catch(e){showToast('Kopiering feilet');}
                ta.remove();
            }

            const ICON_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor"/></svg>';
            const ICON_MOON='<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor"/></svg>';
            function isLightTheme(){ return state.theme==='light'||state.theme==='pastel'; }
            function updateThemeToggleIcon(){ themeToggleBtn.innerHTML=isLightTheme()?ICON_MOON:ICON_SUN; }
            function updateMetaTheme(){ metaTheme.setAttribute('content',META_COLORS[state.theme]||META_COLORS.dark); }
            function toggleTheme(t){state.theme=t;document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('procalc_theme',t);}catch(e){}showToast('Tema: '+t);updateThemeButtons();updateThemeToggleIcon();updateMetaTheme();}
            function loadTheme(){let s=null;try{s=localStorage.getItem('procalc_theme');}catch(e){}if(s)state.theme=s;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)state.theme='light';else state.theme='dark';document.documentElement.setAttribute('data-theme',state.theme);updateThemeToggleIcon();updateMetaTheme();}
            function updateThemeButtons(){$$('#themeOptions .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.theme));}
            function setDecimals(d){state.decimals=parseInt(d,10);try{localStorage.setItem('procalc_dec',d);}catch(e){}showToast('Desimaler: '+d);updateDecimalButtons();updateDisplay();}
            function loadDecimals(){try{const s=localStorage.getItem('procalc_dec');if(s)state.decimals=parseInt(s,10);}catch(e){}}
            function updateDecimalButtons(){$$('#decimalOptions .seg-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.decimals,10)===state.decimals));}
            function setTrigMode(t){state.trigMode=t;try{localStorage.setItem('procalc_trig',t);}catch(e){}showToast('Vinkelmåte: '+t.toUpperCase());updateTrigButtons();updateTrigLabel();}
            function loadTrigMode(){try{const s=localStorage.getItem('procalc_trig');if(s)state.trigMode=s;}catch(e){}}
            function updateTrigButtons(){$$('#trigOptions .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.trig===state.trigMode));}

            function switchMode(mode){
                if(mode===state.mode)return;
                state.mode=mode;
                $$('.nav-item').forEach(i=>i.classList.toggle('active',i.dataset.mode===mode));
                const names={standard:'Standard',professional:'Pro',rpn:'RPN',percent:'Prosent',converter:'Konverter'};
                modeIndicator.textContent=names[mode]||mode;
                closeUnitSheet();
                if(mode==='converter'){
                    buttonsContainer.style.display='none';percentContainer.style.display='none';converterContainer.style.display='flex';displayArea.style.display='none';
                    populateCategoryChips();setConverterCategory(state.converter.category);
                } else if(mode==='percent'){
                    buttonsContainer.style.display='none';converterContainer.style.display='none';percentContainer.style.display='flex';displayArea.style.display='none';
                    renderPctChips();renderPctLabels();percentCalc();
                } else {
                    buttonsContainer.style.display='flex';converterContainer.style.display='none';percentContainer.style.display='none';displayArea.style.display='flex';
                    renderButtons();updateDisplay();
                }
            }

            let swX0=null, swY0=null, swT0=0, swLocked=false;
            function swipeBlockedTarget(t){ return t && typeof t.closest==='function' && t.closest('.category-chips, input, textarea, select, .sheet-grid'); }
            function anyOverlayOpen(){ return unitSheet.classList.contains('open')||settingsModal.classList.contains('open')||infoModal.classList.contains('open')||state.historyOpen; }
            mainContent.addEventListener('touchstart',e=>{
                if(e.touches.length!==1||anyOverlayOpen()||swipeBlockedTarget(e.target))return;
                const t=e.touches[0];
                swX0=t.clientX; swY0=t.clientY; swT0=Date.now(); swLocked=false;
            },{passive:true});
            mainContent.addEventListener('touchmove',e=>{
                if(swX0===null)return;
                const t=e.touches[0];
                const dx=t.clientX-swX0, dy=t.clientY-swY0;
                if(!swLocked&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)swLocked=true;
                if(swLocked&&Math.abs(dy)>70){swLocked=false;swX0=null;}
            },{passive:true});
            mainContent.addEventListener('touchend',e=>{
                if(swX0===null)return;
                const t=e.changedTouches[0];
                const dx=t.clientX-swX0, dy=t.clientY-swY0;
                const dt=Date.now()-swT0;
                swX0=null;
                if(!swLocked||anyOverlayOpen())return;
                if(Math.abs(dx)<60||Math.abs(dy)>50||dt>650)return;
                const idx=MODE_ORDER.indexOf(state.mode);
                if(dx<0&&idx<MODE_ORDER.length-1)switchMode(MODE_ORDER[idx+1]);
                else if(dx>0&&idx>0)switchMode(MODE_ORDER[idx-1]);
            },{passive:true});
            mainContent.addEventListener('touchcancel',()=>{swX0=null;swLocked=false;},{passive:true});

            function renderButtons(){
                let layout,gridClass;
                if(state.mode==='professional'){layout=professionalLayout;gridClass='professional-mode';}
                else if(state.mode==='rpn'){layout=rpnLayout;gridClass='rpn-mode';}
                else{layout=standardLayout;gridClass='standard-mode';}
                buttonsContainer.innerHTML='';
                const grid=document.createElement('div');
                grid.className='calc-buttons '+gridClass;
                layout.forEach(def=>{
                    const btn=document.createElement('button');
                    btn.className='calc-btn '+(def.c||'');
                    btn.dataset.action=def.a;
                    if(def.v)btn.dataset.value=def.v;
                    btn.setAttribute('aria-label',def.l);
                    btn.innerHTML='<span class="btn-label">'+def.l+'</span>';
                    if(def.a==='trigMode')btn.querySelector('.btn-label').textContent=state.trigMode==='deg'?'DEG':'RAD';
                    btn.addEventListener('pointerdown',(e)=>{
                        if(e.pointerType==='mouse'&&e.button!==0)return;
                        createRipple(e,btn);
                        if(navigator.vibrate)try{navigator.vibrate(10);}catch(err){}
                    });
                    let longPressTimer=null,isLongPress=false;
                    btn.addEventListener('pointerdown',(e)=>{
                        if(e.pointerType==='mouse'&&e.button!==0)return;
                        longPressTimer=setTimeout(()=>{
                            isLongPress=true;
                            const info=getButtonInfo(def.a,def.v);
                            if(info)showInfoModal(info.title,info.desc,info.example);
                        },500);
                    });
                    btn.addEventListener('pointerup',()=>{clearTimeout(longPressTimer);setTimeout(()=>{isLongPress=false;},0);});
                    btn.addEventListener('pointerleave',()=>{clearTimeout(longPressTimer);isLongPress=false;});
                    btn.addEventListener('pointercancel',()=>{clearTimeout(longPressTimer);isLongPress=false;});
                    btn.addEventListener('contextmenu',e=>e.preventDefault());
                    btn.addEventListener('click',(e)=>{
                        if(isLongPress){e.preventDefault();return;}
                        handleButtonAction(def.a,def.v);
                    });
                    grid.appendChild(btn);
                });
                buttonsContainer.appendChild(grid);
            }
            function getButtonInfo(action,value){
                if(action==='func'&&value){
                    if(value.startsWith('sin('))return buttonInfo.sin;
                    if(value.startsWith('cos('))return buttonInfo.cos;
                    if(value.startsWith('tan('))return buttonInfo.tan;
                    if(value.startsWith('√('))return buttonInfo.sqrt;
                    if(value.startsWith('∛('))return buttonInfo.cbrt;
                    if(value.startsWith('log('))return buttonInfo.log;
                    if(value.startsWith('ln('))return buttonInfo.ln;
                }
                if(action==='power'&&value==='²')return buttonInfo.square;
                if(action==='power'&&value==='^')return buttonInfo.power;
                if(action==='factorial')return buttonInfo.factorial;
                if(action==='reciprocal')return buttonInfo.reciprocal;
                if(action==='constant'&&value==='π')return buttonInfo.pi;
                if(action==='constant'&&value==='e')return buttonInfo.e;
                if(action==='percent')return buttonInfo.percent;
                if(action==='trigMode')return buttonInfo.trigMode;
                if(action==='memoryClear')return buttonInfo.memoryClear;
                if(action==='memoryRecall')return buttonInfo.memoryRecall;
                if(action==='memoryAdd')return buttonInfo.memoryAdd;
                if(action==='memorySubtract')return buttonInfo.memorySubtract;
                if(action==='ans')return buttonInfo.ans;
                if(action==='paren')return buttonInfo.paren;
                return null;
            }
            const rpnFns={rpnClear:rpnClear,rpnBackspace:rpnBackspace,rpnSwap:rpnSwap,rpnDrop:rpnDrop,rpnEnter:rpnEnter,rpnNumber:rpnNumber,rpnDecimal:rpnDecimal,rpnOp:rpnOp};
            const memoryFns={memoryClear:memoryClear,memoryRecall:memoryRecall,memoryAdd:memoryAdd,memorySubtract:memorySubtract};
            function handleButtonAction(a,v){
                if(state.mode==='rpn'&&rpnFns[a]){rpnFns[a](v);return;}
                if(memoryFns[a]){memoryFns[a]();return;}
                switch(a){
                    case'number':handleNumber(v);break;case'operator':handleOperator(v);break;case'decimal':handleDecimal();break;case'equals':handleEquals();break;case'clear':handleClear();break;case'backspace':handleBackspace();break;case'sign':handleSign();break;case'percent':handlePercent();break;case'paren':handleParen(v);break;case'func':handleFunc(v);break;case'constant':handleConstant(v);break;case'power':handlePower(v);break;case'factorial':handleFactorial();break;case'reciprocal':handleReciprocal();break;case'ans':handleAns();break;case'trigMode':handleTrigMode();break;
                }
            }
            function createRipple(e,btn){const rect=btn.getBoundingClientRect();const ripple=document.createElement('span');ripple.className='ripple';const size=Math.max(rect.width,rect.height)*1.2;ripple.style.width=ripple.style.height=size+'px';ripple.style.left=(e.clientX-rect.left-size/2)+'px';ripple.style.top=(e.clientY-rect.top-size/2)+'px';btn.appendChild(ripple);setTimeout(()=>ripple.remove(),500);}

            function showInfoModal(title,desc,example){infoTitle.textContent=title;infoDesc.textContent=desc;infoExample.textContent=example||'';infoModal.classList.add('open');}
            function closeInfoModal(){infoModal.classList.remove('open');}

            function openHistory(){state.historyOpen=true;historyOverlay.classList.add('open');historyDrawer.classList.add('open');renderHistory(historySearchInput.value);}
            function closeHistory(){state.historyOpen=false;historyOverlay.classList.remove('open');historyDrawer.classList.remove('open');}
            let toastTimer=null;
            function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);}

            function handleKeyboard(e){
                const t=e.target;
                if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)){if(e.key==='Escape'&&unitSheet.classList.contains('open'))closeUnitSheet();return;}
                if(unitSheet.classList.contains('open')){if(e.key==='Escape')closeUnitSheet();return;}
                if(settingsModal.classList.contains('open')){if(e.key==='Escape')settingsModal.classList.remove('open');return;}
                if((e.key==='Enter'||e.key===' ')&&t&&typeof t.closest==='function'&&t.closest('button'))return;
                if(state.mode==='converter'||state.mode==='percent')return;
                const key=e.key;
                if(/[0-9]/.test(key)){state.mode==='rpn'?rpnNumber(key):handleNumber(key);}
                else if(key===','||key==='.'){state.mode==='rpn'?rpnDecimal():handleDecimal();}
                else if(key==='+'){state.mode==='rpn'?rpnOp('+'):handleOperator('+');}
                else if(key==='-'){state.mode==='rpn'?rpnOp('-'):handleOperator('−');}
                else if(key==='*'){state.mode==='rpn'?rpnOp('*'):handleOperator('×');}
                else if(key==='/'){e.preventDefault();state.mode==='rpn'?rpnOp('/'):handleOperator('÷');}
                else if(key==='Enter'){e.preventDefault();state.mode==='rpn'?rpnEnter():handleEquals();}
                else if(key==='Backspace'){state.mode==='rpn'?rpnBackspace():handleBackspace();}
                else if(key==='Escape'){state.mode==='rpn'?rpnClear():handleClear();}
                else if(state.mode!=='rpn'&&key==='^'){handlePower('^');}
                else if(state.mode!=='rpn'&&key==='('){handleParen('(');}
                else if(state.mode!=='rpn'&&key===')'){handleParen(')');}
                else if(state.mode!=='rpn'&&key==='%'){handlePercent();}
            }

            /* ============ PWA: INSTALLASJON ============ */
            let deferredPrompt=null;
            const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
            const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
            window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; installBtn.style.display='block'; installBtn.textContent='Installer som app'; });
            window.addEventListener('appinstalled',()=>{ installBtn.style.display='none'; installHint.textContent='Appen er installert på enheten.'; showToast('Appen er installert'); });
            installBtn.addEventListener('click',async()=>{
                if(deferredPrompt){
                    deferredPrompt.prompt();
                    const choice=await deferredPrompt.userChoice;
                    showToast(choice.outcome==='accepted'?'Appen installeres':'Installasjon avbrutt');
                    deferredPrompt=null; installBtn.style.display='none';
                } else if(isIOS&&!isStandalone){
                    showInfoModal('Installer på iOS/iPadOS','Åpne delingsmenyen (Del-knappen) i nettleseren, og velg deretter «Legg til på hjemskjerm». Appen åpnes da i fullskjerm som en egen app.','');
                } else {
                    showToast('Bruk nettlesermenyen → «Legg til på startskjerm»');
                }
            });

            document.addEventListener('keydown',handleKeyboard);
            historyToggleBtn.addEventListener('click',()=>state.historyOpen?closeHistory():openHistory());
            historyOverlay.addEventListener('click',closeHistory);
            clearHistoryBtn.addEventListener('click',clearHistory);
            themeToggleBtn.addEventListener('click',()=>{ toggleTheme(isLightTheme()?'dark':'light'); });
            settingsBtn.addEventListener('click',()=>settingsModal.classList.add('open'));
            closeSettingsBtn.addEventListener('click',()=>settingsModal.classList.remove('open'));
            settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)settingsModal.classList.remove('open');});
            $$('#themeOptions .seg-btn').forEach(b=>b.addEventListener('click',()=>toggleTheme(b.dataset.theme)));
            $$('#decimalOptions .seg-btn').forEach(b=>b.addEventListener('click',()=>setDecimals(b.dataset.decimals)));
            $$('#trigOptions .seg-btn').forEach(b=>b.addEventListener('click',()=>setTrigMode(b.dataset.trig)));
            $('#closeInfoBtn').addEventListener('click',closeInfoModal);
            infoModal.addEventListener('click',(e)=>{if(e.target===infoModal)closeInfoModal();});
            historySearchInput.addEventListener('input',()=>renderHistory(historySearchInput.value));
            $$('.nav-item').forEach(item=>item.addEventListener('click',()=>switchMode(item.dataset.mode)));
            fromUnitPicker.addEventListener('click',()=>openUnitSheet('from'));
            toUnitPicker.addEventListener('click',()=>openUnitSheet('to'));
            sheetOverlay.addEventListener('click',closeUnitSheet);
            sheetCloseBtn.addEventListener('click',closeUnitSheet);
            fromValueInput.addEventListener('input',performConversion);
            swapUnitsBtn.addEventListener('click',swapUnits);
            resultDisplay.addEventListener('dblclick',()=>{copyText(state.result,'Resultat kopiert');});

            function init(){
                loadTheme();loadDecimals();loadTrigMode();loadHistory();
                updateThemeButtons();updateDecimalButtons();updateTrigButtons();updateThemeToggleIcon();
                updateHistoryBadge();renderHistory();renderButtons();updateDisplay();
                populateCategoryChips();renderUnitPickers();updateHints();
                renderPctChips();renderPctLabels();
                const defaultUnits=getUnitList(state.converter.category);
                if(defaultUnits.length){state.converter.fromUnit=defaultUnits[0].key;state.converter.toUnit=defaultUnits.length>1?defaultUnits[1].key:defaultUnits[0].key;}
                renderUnitPickers();
                /* PWA-status og dypelenker fra manifest-shortcuts */
                if(isStandalone){ installHint.textContent='Kjører som installert app.'; }
                else if(isIOS){ installBtn.style.display='block'; installBtn.textContent='Installer (guide for iOS)'; }
                const hash=location.hash.replace('#','');
                if(MODE_ORDER.includes(hash))switchMode(hash);
                const hh=document.querySelector('.history-header');
                if(hh&&!hh.querySelector('.export-history-btn')){
                    const expBtn=document.createElement('button');
                    expBtn.className='clear-history-btn export-history-btn';
                    expBtn.textContent='Eksporter';
                    expBtn.style.marginRight='8px';
                    expBtn.addEventListener('click',exportHistory);
                    hh.insertBefore(expBtn,clearHistoryBtn);
                }
                /* Registrer service worker for offline og installasjon */
                if('serviceWorker' in navigator){
                    window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
                }
                console.log('Pro Kalkulator Ultra klar');
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
        })();
    </script>
</body>
</html>
